console:
  titolo: ⌨️ Console
  sotto: per chi vuole provare i comandi veri
  esempio: |-
    un comando per riga, es.
    configure terminal
    interface GigabitEthernet0/0

# I «?» accanto ai campi: si leggono passandoci sopra con il mouse.
aiuti:
  acl: >-
    Un'ACL è un elenco di regole «permetti / nega» che il router controlla per ogni pacchetto che
    passa da una porta. Serve a fare da firewall.
  acl_nome: Un numero (1-99 per le standard, 100-199 per le estese) o un nome di una parola.
  acl_tipo: >-
    Standard: guarda solo da dove arriva il pacchetto. Estesa: anche verso dove va e per quale
    servizio (es. il web, porta 80).
  acl_porta: >-
    La porta del router dove il filtro lavora. Di solito: il più vicino possibile a chi vuoi
    bloccare.
  acl_verso: >-
    In ingresso: il traffico che entra nel router da quella porta. In uscita: quello che ne esce.
  acl_indirizzo: >-
    any = chiunque · un indirizzo (192.168.1.2) = un solo dispositivo · una rete
    (192.168.1.0/24) = tutta la rete.
  enable_secret: >-
    La password chiesta da «enable», cioè per diventare amministratore del dispositivo. Senza,
    chiunque arrivi alla console comanda.
  cifra: >-
    service password-encryption: le password scritte nella configurazione non si leggono più in
    chiaro.
  audit: Cerca le falle nella configurazione (password mancanti, scritte in chiaro, account sospetti).
  fw_zone: >-
    Ogni porta del firewall collega una zona: inside (la rete dell'azienda), dmz (i server che il mondo
    deve raggiungere, come il sito), outside (Internet).
  fw_zona: Il nome della zona. Con inside, dmz e outside il livello si propone da solo.
  fw_livello: >-
    Quanto ci si fida della zona: 100 = massimo (interna), 0 = per niente (Internet). Di base si aprono
    connessioni solo verso livelli più bassi.
  fw_regole: >-
    Eccezioni alla regola di base. Esempio classico: da outside verso dmz, tcp 80, destinazione il
    server web: permetti. Così Internet vede il sito ma non la rete interna.
  fw_destinazione: "Vuoto = tutta la zona di arrivo; altrimenti un IP (172.16.0.10) o una rete (172.16.0.0/24)."
  limite: >-
    Il traffico che esce da quella porta non supera questa velocità. 64 kbps basta per una linea di
    servizio, 1000 kbps è 1 Mbps.
  utenti: >-
    Gli account con cui si entra nel dispositivo. Un account che nessuno ha creato, o con la
    password in chiaro, è una porta aperta per gli attaccanti. Le password non vengono mai mostrate.
  ip: Il «numero civico» del dispositivo nella rete, es. 192.168.10.11. Deve essere unico.
  maschera: Dice quanta parte dell'IP è la rete. 255.255.255.0 = i primi tre numeri sono la rete.
  gateway: "L'IP del router nella tua rete: lì vanno i pacchetti diretti ad altre reti."
  dhcp: Il PC chiede da solo IP, maschera e gateway a un server DHCP (di solito il router).
  porta_accesa: Le porte dei router nascono spente. Una porta spenta (shutdown) non fa passare niente.
  vlan: Una VLAN divide lo switch in «stanze» separate. Le porte nella stessa VLAN si vedono tra loro.
  rotta: Indica al router dove mandare i pacchetti per una rete che non è collegata direttamente.
