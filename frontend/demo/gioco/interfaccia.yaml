# Testi dell'interfaccia del client demo. Si possono cambiare a gioco acceso: basta ricaricare la pagina.
#
# - I segnaposto tra graffe ({nome}, {punti}…) vengono sostituiti dal gioco: lasciali com'è.
# - Nei testi dei pannelli si può usare un po' di HTML: <b>grassetto</b>, <br> per andare a capo.
#   Negli avvisi (quelli che compaiono in alto a destra) e nelle domande di conferma no: lì l'HTML si
#   vedrebbe così com'è.
# - Le missioni e i livelli (storie, ticket, indizi…) sono in accademia.yaml e pronto-soccorso.yaml;
#   punteggi, dispositivi e tempi in impostazioni.yaml.

