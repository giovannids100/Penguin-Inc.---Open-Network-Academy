# Giorno 3 (challenge 3.1): la rete del cliente Krill & Co. INTERNET simula il provider, R1 collega
# Internet, il server WEB e, attraverso R2, la rete interna. R2 ha porte libere per la VPN e il cloud.

dispositivi:
  - nome: PC-ESTERNO
    tipo: pc
    pos: [100, 80]
    ip: 203.0.113.10/24
    gateway: 203.0.113.1
  - nome: SW-INTERNET
    tipo: switch
    pos: [258, 80]
  - nome: INTERNET
    tipo: router
    pos: [420, 80]
    config: |
      interface GigabitEthernet0/0
       ip address 198.51.100.1 255.255.255.252
       no shutdown
      interface GigabitEthernet0/1
       ip address 203.0.113.1 255.255.255.0
       no shutdown
      ip route 172.16.10.0 255.255.255.0 198.51.100.2
      ip route 192.168.1.0 255.255.255.0 198.51.100.2
      ip route 10.0.0.0 255.255.255.252 198.51.100.2
  - nome: R1
    tipo: router
    pos: [420, 270]
    config: |
      interface GigabitEthernet0/0
       ip address 198.51.100.2 255.255.255.252
       no shutdown
      interface GigabitEthernet0/1
       ip address 172.16.10.1 255.255.255.0
       no shutdown
      interface GigabitEthernet0/2
       ip address 10.0.0.1 255.255.255.252
       no shutdown
      ip route 192.168.1.0 255.255.255.0 10.0.0.2
      ip route 0.0.0.0 0.0.0.0 198.51.100.1
  - nome: SW1
    tipo: switch
    pos: [618, 270]
  - nome: WEB
    tipo: server
    pos: [798, 270]
    ip: 172.16.10.10/24
    gateway: 172.16.10.1
    servizi: [http, https, ftp, smtp]
  - nome: R2
    tipo: router
    pos: [418, 460]
    porte: [FastEthernet0/0, FastEthernet1/0, Serial2/0, Serial3/0, FastEthernet4/0, FastEthernet5/0]
    config: |
      interface FastEthernet0/0
       ip address 10.0.0.2 255.255.255.252
       no shutdown
      interface FastEthernet1/0
       ip address 192.168.1.1 255.255.255.0
       no shutdown
      ip route 0.0.0.0 0.0.0.0 10.0.0.1
  - nome: SW2
    tipo: switch
    pos: [618, 460]
  - nome: PC1
    tipo: pc
    pos: [800, 400]
    ip: 192.168.1.11/24
    gateway: 192.168.1.1
  - nome: PC2
    tipo: pc
    pos: [800, 470]
    ip: 192.168.1.12/24
    gateway: 192.168.1.1
  - nome: INTRANET
    tipo: server
    pos: [798, 540]
    ip: 192.168.1.10/24
    gateway: 192.168.1.1
    servizi: [http, https, ftp, smtp]

cavi:
  - [PC-ESTERNO, FastEthernet0, SW-INTERNET, FastEthernet0/1]
  - [SW-INTERNET, GigabitEthernet0/1, INTERNET, GigabitEthernet0/1]
  - [INTERNET, GigabitEthernet0/0, R1, GigabitEthernet0/0]
  - [R1, GigabitEthernet0/1, SW1, GigabitEthernet0/1]
  - [SW1, FastEthernet0/1, WEB, FastEthernet0]
  - [R1, GigabitEthernet0/2, R2, FastEthernet0/0]
  - [R2, FastEthernet1/0, SW2, FastEthernet0/24]
  - [SW2, FastEthernet0/1, PC1, FastEthernet0]
  - [SW2, FastEthernet0/2, PC2, FastEthernet0]
  - [SW2, FastEthernet0/3, INTRANET, FastEthernet0]
