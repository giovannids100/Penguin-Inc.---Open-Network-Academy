# Giorno 4 (challenge 4.1): la rete sotto attacco. INTERNET simula il provider (con NEWS e l'attaccante
# PC-ESTERNO), R1 la sala server (WEB, FILE), R2 l'ufficio e la filiale.

dispositivi:
