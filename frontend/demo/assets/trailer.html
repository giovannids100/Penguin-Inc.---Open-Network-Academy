<title>Penguin Inc Trailer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Una sala buia da proiezione: lo schermo 16:9 al centro, i comandi sotto. Un solo aspetto (notte antartica). */
:root {
  --notte: #0b1020;
  --pannello: #141c33;
  --bordo: #0a0f1c;
  --ghiaccio: #e8f0fa;
  --tenue: #8fa2c6;
  --oro: #f5c542;
  --blu: #2f6fd6;
  --rosso: #d9443c;
  --pixel: "Press Start 2P", ui-monospace, monospace;
  --testo: "Pixelify Sans", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--notte); color: var(--ghiaccio); font-family: var(--testo);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.schermo {
  position: relative; width: min(100%, calc((100vh - 120px) * 16 / 9)); max-width: 100%; aspect-ratio: 16 / 9;
  background: #000; border: 4px solid var(--bordo); border-radius: 6px; box-shadow: 0 16px 60px rgba(0, 0, 0, .6);
}
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; border-radius: 2px; }
.via {
  position: absolute; inset: 0; display: grid; place-items: center; background: rgba(6, 9, 18, .55);
  border: 0; color: inherit; cursor: pointer; font: inherit; padding: 0;
}
.via span {
  font-family: var(--pixel); font-size: clamp(12px, 2.2vw, 20px); background: var(--oro); color: var(--bordo);
  border: 4px solid var(--bordo); border-radius: 4px; padding: 16px 22px; box-shadow: 0 5px 0 var(--bordo);
}
.via:hover span { filter: brightness(1.08); }
.via:focus-visible span { outline: 3px solid #fff; outline-offset: 3px; }
.comandi {
  width: min(100%, calc((100vh - 120px) * 16 / 9)); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
}
.comandi button {
  font-family: var(--pixel); font-size: 11px; color: var(--ghiaccio); background: var(--pannello);
  border: 3px solid var(--bordo); border-radius: 3px; padding: 8px 10px; cursor: pointer; box-shadow: 0 3px 0 var(--bordo);
}
.comandi button:hover { background: #1d2850; }
.comandi button:active { transform: translateY(3px); box-shadow: none; }
.comandi button:focus-visible { outline: 3px solid var(--oro); }
.comandi .rec { background: var(--rosso); color: #fff; }
.barra { flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 10px; }
.barra input { flex: 1; min-width: 0; accent-color: var(--oro); }
.tempo { font-family: var(--pixel); font-size: 10px; color: var(--tenue); font-variant-numeric: tabular-nums; white-space: nowrap; }
.nota { width: min(100%, calc((100vh - 120px) * 16 / 9)); margin: 0; font-size: 13px; color: var(--tenue); }
.nota b { color: var(--ghiaccio); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .via span { box-shadow: none; } }
</style>

<div class="schermo">
  <canvas id="tela" width="1280" height="720" aria-label="Trailer di Penguin Inc"></canvas>

<p class="nota" id="nota">Trailer di <b>Penguin Inc</b>, il serious game su reti e cybersicurezza su una rete vera, costruita con Mininet. Durata 2:30, con musica. Le schermate del gioco sono catture vere.</p>

<script>
"use strict";
/* Trailer di Penguin Inc: tutto è disegnato su un canvas 1280×720 a partire dagli asset del gioco
 * (cartella penguin/, accanto a questa pagina). La musica è generata con Web Audio.
 * L'orologio è quello dell'audio: pausa = audio sospeso, così immagini e musica restano sempre insieme.
 * Ogni scena è una funzione del tempo: si può saltare in qualunque punto. */

const W = 1280, H = 720, DUR = 150;
const tela = document.getElementById("tela");
const g = tela.getContext("2d");
g.imageSmoothingEnabled = false;

/* ───────────── immagini ───────────── */
const FILE = {
  ufficio: "penguin/scene/ufficio.png", allarme: "penguin/scene/ufficio_allarme.png", war: "penguin/scene/war_room.png",
  jrCammina: "penguin/sprite/jr_cammina.png", jrSeduto: "penguin/sprite/jr_seduto.png",
  srCammina: "penguin/sprite/sr_cammina.png", srSeduto: "penguin/sprite/sr_seduto.png",
  cursore: "penguin/ui/cursore.png", mano: "penguin/ui/mano.png",
  s01: "trailer/01_dispositivi.jpg", s02: "trailer/02_cavi.jpg", s03: "trailer/03_ip.jpg", s04: "trailer/04_ping.jpg",
  s06: "trailer/06_vittoria.jpg", s07: "trailer/07_aiuto_jody.jpg", s08: "trailer/08_ticket.jpg",
  s09: "trailer/09_console.jpg", s10: "trailer/10_livello_vinto.jpg",
  jr_idle: "penguin/ritratti/pinguino_jr_idle.png", jr_preoccupato: "penguin/ritratti/pinguino_jr_preoccupato.png",
  sr_caffe: "penguin/ritratti/pinguino_sr_caffe.png", sr_tastiera: "penguin/ritratti/pinguino_sr_tastiera.png",
  sr_spaventato: "penguin/ritratti/pinguino_sr_spaventato.png",
  boss_arrabbiato: "penguin/ritratti/boss_arrabbiato.png",
  foca_parla: "penguin/ritratti/foca_parla.png", foca_blink: "penguin/ritratti/foca_blink.png",
};
const IMG = {};
function caricaImmagini() {
  return Promise.all(Object.entries(FILE).map(([k, src]) => new Promise((ok) => {
    const im = new Image();
    im.onload = () => { IMG[k] = im; ok(); };
    im.onerror = () => ok();          // un'immagine mancante non ferma il trailer
    im.src = src;
  })));
}

/* ───────────── strumenti di disegno ───────────── */
const C = { notte: "#0b1020", bordo: "#0e1a33", titolo: "#2c4a7c", ghiaccio: "#e8f0fa", oro: "#f5c542", blu: "#2f6fd6",
  verde: "#1f9d55", rosso: "#d9443c", testo: "#142033", tenue: "#8fa2c6", piastrella: "#dcebf5", riga: "#c4d9ea" };
const PIX = (s) => `${s}px "Press Start 2P", ui-monospace, monospace`;
const VT = (s) => `${s}px VT323, ui-monospace, monospace`;
const PS = (s, w = 400) => `${w} ${s}px "Pixelify Sans", system-ui, sans-serif`;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => (x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const pop = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, x) => a + (b - a) * x;

function testo(s, x, y, font, colore, allinea = "center", ombra = null) {
  g.font = font; g.textAlign = allinea; g.textBaseline = "middle";
  if (ombra) { g.fillStyle = ombra; g.fillText(s, x + 3, y + 3); }
  g.fillStyle = colore; g.fillText(s, x, y);
}
/* Macchina da scrivere: quante lettere si vedono al tempo t. */
const scritto = (s, t, inizio, vel = 32) => s.slice(0, Math.max(0, Math.floor((t - inizio) * vel)));
function aCapo(s, font, larghezza) {
  g.font = font;
  const righe = []; let riga = "";
  for (const p of s.split(" ")) {
    const prova = riga ? `${riga} ${p}` : p;
    if (g.measureText(prova).width > larghezza && riga) { righe.push(riga); riga = p; } else riga = prova;
  }
  if (riga) righe.push(riga);
  return righe;
}
function finestra(x, y, w, h, fondo = C.ghiaccio, barra = C.titolo) {
  g.fillStyle = "rgba(0,0,0,.4)"; g.fillRect(x + 8, y + 8, w, h);
  g.fillStyle = C.bordo; g.fillRect(x - 4, y - 4, w + 8, h + 8);
  g.fillStyle = fondo; g.fillRect(x, y, w, h);
  if (barra) { g.fillStyle = barra; g.fillRect(x, y, w, 18); }
}
function immagine(k, x, y, w, h) { if (IMG[k]) g.drawImage(IMG[k], x, y, w, h); }
/* Un fotogramma di un foglio di sprite (colonne × righe di celle cw × ch). */
function sprite(k, col, riga, cw, ch, x, y, scala) {
  if (IMG[k]) g.drawImage(IMG[k], col * cw, riga * ch, cw, ch, x, y, cw * scala, ch * scala);
}

/* Neve deterministica: dipende solo dal tempo, così funziona anche saltando avanti e indietro. */
function neve(t, quanti = 90, alfa = .8) {
  g.fillStyle = `rgba(232,240,250,${alfa})`;
  for (let i = 0; i < quanti; i++) {
    const a = (i * 7919) % 1000 / 1000, b = (i * 104729) % 1000 / 1000, v = 30 + 60 * ((i * 31) % 10) / 10;
    const x = (a * W + Math.sin(t * .7 + i) * 18) % W;
    const y = (b * H + t * v) % H;
    const s = i % 3 === 0 ? 4 : 3;
    g.fillRect(Math.round(x), Math.round(y), s, s);
  }
}
function cielo() {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, "#0b1020"); gr.addColorStop(1, "#1a2950");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}

/* La scena dell'ufficio vista da una «telecamera»: centro (cx, cy) in pixel dell'immagine 384×288, ingrandimento z. */
function ufficio(chiave, cx, cy, z, scuoti = 0) {
  const ox = W / 2 - cx * z + (scuoti ? Math.sin(performance.now() / 30) * scuoti : 0);
  const oy = H / 2 - cy * z;
  g.fillStyle = "#0e1424"; g.fillRect(0, 0, W, H);
  immagine(chiave, ox, oy, 384 * z, 288 * z);
  return { ox, oy, z, p: (x, y) => [ox + x * z, oy + y * z] };
}
/* Un pinguino in piedi (foglio 4×4 di celle 32×32: giù, sx, dx, su) con i piedi in (x, y) dell'ufficio. */
function pinguino(cam, k, x, y, dir, passo) {
  const riga = { giu: 0, sx: 1, dx: 2, su: 3 }[dir];
  const [sx, sy] = cam.p(x - 16, y - 31);
  sprite(k, passo % 4, riga, 32, 32, sx, sy, cam.z);
}

/* Il riquadro dei dialoghi del gioco: ritratto + fumetto con nome e testo che si scrive. */
const PERSONE = {
  jr: { nome: "Pina", colore: "#334155" }, sr: { nome: "Jody", colore: "#1d4ed8", ruolo: "collega senior" },
  boss: { nome: "Il Capo", colore: "#b91c1c", ruolo: "orso polare" }, foca: { nome: "???", colore: "#6d28d9", ruolo: "sconosciuto" },
};
function dialogo(t, inizio, chi, faccia, frase) {
  const p = PERSONE[chi];
  const y = 528, h = 168;
  g.fillStyle = C.bordo; g.fillRect(36, y - 6, 180, 180);
  g.fillStyle = chi === "boss" ? "#fde2e2" : chi === "foca" ? "#3b2a4a" : C.ghiaccio; g.fillRect(42, y, 168, 168);
  immagine(`${chi}_${faccia}`, 42, y, 168, 168);
  g.fillStyle = "rgba(0,0,0,.35)"; g.fillRect(238, y + 6, 1012, h);
  g.fillStyle = C.bordo; g.fillRect(226, y - 6, 1018, h + 12);
  g.fillStyle = C.ghiaccio; g.fillRect(232, y, 1006, h);
  testo(p.nome, 256, y + 26, PIX(15), p.colore, "left");
  if (p.ruolo) { g.font = PIX(15); const w = g.measureText(p.nome).width; testo(p.ruolo, 272 + w, y + 27, VT(24), "#64748b", "left"); }
  const righe = aCapo(frase, VT(38), 950);
  let resto = Math.max(0, Math.floor((t - inizio) * 38));
  righe.forEach((r, i) => {
    const pezzo = r.slice(0, resto); resto -= r.length + 1;
    if (pezzo) testo(pezzo, 256, y + 72 + i * 38, VT(38), C.testo, "left");
  });
}
/* Una battuta per intervallo: [inizio, fine, chi, faccia, frase]. */
function battute(t, elenco) {
  for (const [a, b, chi, faccia, frase] of elenco) if (t >= a && t < b) dialogo(t, a, chi, faccia, frase);
}
/* Didascalia: banda scura con testo in pixel, entra e esce con dissolvenza. */
function didascalia(t, a, b, s, y = 70, dim = 24, colore = "#fff") {
  if (t < a || t > b) return;
  const al = Math.min(lin(t, a, a + .4), 1 - lin(t, b - .4, b));
  g.save(); g.globalAlpha = al;
  g.font = PIX(dim); const w = g.measureText(s).width;
  g.fillStyle = "rgba(10,15,28,.82)"; g.fillRect(W / 2 - w / 2 - 24, y - dim, w + 48, dim * 2);
  testo(s, W / 2, y + 2, PIX(dim), colore);
  g.restore();
}

/* ───────────── le schermate vere del gioco ─────────────
 * Le immagini in trailer/ sono catture del gioco vero (800×600).
 * schermata() le mostra a tutta altezza con un lento avvicinamento verso il punto che conta. */
function schermata(k, t, a, b, fuoco = [400, 300], zoomFinale = 1.4) {
  g.fillStyle = C.notte; g.fillRect(0, 0, W, H);
  neve(t, 50, .3);
  const q = ease(lin(t, a + .6, b - .4));
  const z = mix(1, zoomFinale, q) * 1.2;                   // 1,2 = 600 px di cattura → 720 px di video
  const fx = mix(400, fuoco[0], q), fy = mix(300, fuoco[1], q);
  const x = W / 2 - fx * z, y = H / 2 - fy * z;
  immagine(k, x, y, 800 * z, 600 * z);
  return (px, py) => [x + px * z, y + py * z];             // da coordinate della cattura a coordinate del video
}
/* I coriandoli del gioco (stessi colori e forme di confetti() in app.js), che cadono a partire da «inizio». */
function coriandoli(t, inizio) {
  const colori = ["#2563eb", "#16a34a", "#d97706", "#7c3aed", "#dc2626"];
  for (let i = 0; i < 90; i++) {
    const ritardo = (i % 9) * .06, durata = 1.6 + ((i * 37) % 10) / 10 * 1.6;
    const f = lin(t, inizio + ritardo, inizio + ritardo + durata);
    if (f <= 0 || f >= 1) continue;
    const x = ((i * 7919) % 1000) / 1000 * W, y = mix(-20, H + 30, f * f);
    g.save(); g.translate(x + Math.sin(f * 9 + i) * 14, y); g.rotate((i * 40 + f * 900) * Math.PI / 180);
    g.fillStyle = colori[i % 5]; g.fillRect(-6, -9, 12, 18);
    g.restore();
  }
}
function cursore(x, y, mano = false) { immagine(mano ? "mano" : "cursore", x - (mano ? 16 : 6), y - 4, 48, 48); }
/* Il riquadro di domanda del gioco (Sì / No), come quando si offre un caffè a Jody. */
function domanda(t, inizio, frase, scelta) {
  dialogo(t, inizio, "jr", "preoccupato", frase);
  if (t < inizio + 1.2) return;
  const bottone = (x, s, primario, premuto) => {
    const dy = premuto ? 4 : 0;
    g.fillStyle = C.bordo; g.fillRect(x - 4, 650 - 4 + dy, 130, 50 + (premuto ? 0 : 4));
    g.fillStyle = primario ? C.blu : "#fff"; g.fillRect(x, 650 + dy, 122, 42);
    testo(s, x + 61, 672 + dy, PIX(14), primario ? "#fff" : C.testo);
  };
  bottone(256, "Sì", true, t >= scelta && t < scelta + .25);
  bottone(396, "No", false, false);
}

/* ───────────── le scene ───────────── */
const SCENE = [
  { a: 0, b: 8, disegna: apertura },
  { a: 8, b: 15, disegna: titolo },
  { a: 15, b: 29, disegna: primoGiorno },
  { a: 29, b: 38, disegna: difficolta },
  { a: 38, b: 67, disegna: interfaccia },
  { a: 67, b: 85, disegna: caffe },
  { a: 85, b: 92, disegna: aiutoSulTavolo },
  { a: 92, b: 110, disegna: sicurezza },
  { a: 110, b: 134, disegna: attacco },
  { a: 134, b: DUR + 1, disegna: finale },
];

function apertura(t) {
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  neve(t, 70, lin(t, 0, 3) * .8);
  if (t > .5) testo(scritto("Come fanno due computer a parlarsi?", t, .5, 30), W / 2, 250, VT(52), C.ghiaccio);
  if (t > 2.9) testo(scritto("E come si difende una rete da un attacco?", t, 2.9, 30), W / 2, 330, VT(52), C.ghiaccio);
  if (t > 5.4) testo(scritto("Qui lo impari facendo.", t, 5.4, 22), W / 2, 440, PIX(26), C.oro, "center", C.bordo);
}

function titolo(t) {
  cielo(); neve(t, 110);
  const k = pop(lin(t, 8.3, 9.3));
  g.save(); g.translate(W / 2, 250); g.scale(k, k);
  testo("PENGUIN INC", 0, 0, PIX(84), C.oro, "center", C.bordo);
  g.restore();
  if (t > 9.7) testo(scritto("Il tuo primo lavoro nel networking", t, 9.7, 30), W / 2, 345, VT(46), C.ghiaccio);
  if (t > 10.8) {
    const y = mix(H + 40, 430, ease(lin(t, 10.8, 11.8)));
    g.fillStyle = C.bordo; g.fillRect(W / 2 - 104, y - 4, 208, 208);
    g.fillStyle = C.ghiaccio; g.fillRect(W / 2 - 100, y, 200, 200);
    immagine("jr_idle", W / 2 - 100, y, 200, 200);
  }
}

function primoGiorno(t) {
  // telecamera: da tutto l'ufficio a vicino al collega, subito
  const z = ease(lin(t, 16.4, 17.4));
  const cam = ufficio("ufficio", mix(192, 150, z), mix(144, 212, z), mix(2.5, 5, z));
  // il protagonista entra dalla porta in basso e raggiunge Jody in poco più di un secondo
  let x = 123, y = 252, dir = "dx";
  if (t < 16.2) { y = mix(300, 252, lin(t, 15.1, 16.2)); dir = "su"; }
  else x = mix(123, 146, lin(t, 16.2, 16.9));
  const passo = t < 16.9 ? Math.floor(t * 10) : 0;
  pinguino(cam, "srCammina", 172, 250, "sx", 0);
  pinguino(cam, "jrCammina", x, y, dir, passo);
  didascalia(t, 15.1, 17.2, "GIORNO 1", 64, 28, C.oro);
  battute(t, [
    [17.5, 20.8, "sr", "caffe", "Eccoti! Tu devi essere Pina, la nuova recluta."],
    [20.8, 24.3, "sr", "tastiera", "Qui le reti si costruiscono davvero: ogni dispositivo è una macchina Linux."],
    [24.3, 26.6, "jr", "preoccupato", "Ma io di reti non so niente…"],
    [26.6, 29, "sr", "caffe", "Per questo sei qui. Si impara facendo!"],
  ]);
}

/* La difficoltà sale giorno dopo giorno: tre gradini, senza dire le sfide. */
function difficolta(t) {
  cielo(); neve(t, 60, .5);
  if (t > 29.2) testo(scritto("SI PARTE DA ZERO", t, 29.2, 20), W / 2, 92, PIX(32), C.ghiaccio, "center", C.bordo);
  ["GIORNO 1", "GIORNO 2", "GIORNO 3"].forEach((giorno, i) => {
    const a = 30.3 + i * 1.1;
    if (t < a) return;
    const x = 130 + i * 360, yFinale = 400 - i * 85, y = mix(H + 30, yFinale, ease(lin(t, a, a + .6)));
    finestra(x, y, 300, 190);
    testo(giorno, x + 150, y + 56, PIX(22), C.oro, "center", C.bordo);
    // l'indicatore di difficoltà: tre tacche, se ne accendono 1, 2, 3
    for (let k = 0; k < 3; k++) {
      const accesa = k <= i && t > a + .5 + k * .15;
      g.fillStyle = C.bordo; g.fillRect(x + 60 + k * 64 - 3, y + 104 - 3, 56, 40);
      g.fillStyle = accesa ? [C.verde, C.oro, C.rosso][i] : "#c9d6e6"; g.fillRect(x + 60 + k * 64, y + 104, 50, 34);
    }
    testo("difficoltà", x + 150, y + 168, VT(28), "#3d4f70");
  });
  if (t > 33.6) {
    const al = lin(t, 33.6, 34.2);
    g.save(); g.globalAlpha = al; testo("OGNI GIORNO UN PO' PIÙ DIFFICILE", W / 2, 668, PIX(24), C.oro, "center", C.bordo); g.restore();
  }
}

/* L'interfaccia vera: catture del gioco. */
function interfaccia(t) {
  if (t < 44) {
    schermata("s01", t, 38, 44, [150, 290], 1.7);
    didascalia(t, 38.4, 43.8, "OGNI MISSIONE TI SPIEGA LA TEORIA", 60, 20);
  } else if (t < 49.5) {
    const p = schermata("s02", t, 44, 49.5, [510, 240], 1.55);
    didascalia(t, 44.2, 49.3, "COSTRUISCI LA RETE: DISPOSITIVI E CAVI", 60, 20);

function disegna(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.imageSmoothingEnabled = false;
  const s = SCENE.find((x) => t >= x.a && t < x.b) || SCENE[SCENE.length - 1];
  s.disegna(t);
  // dissolvenza al nero tra una scena e l'altra
  const dentro = Math.min(t - s.a, s.b - t);
  if (s.a > 0 && dentro < .35) { g.fillStyle = `rgba(0,0,0,${1 - dentro / .35})`; g.fillRect(0, 0, W, H); }
}

/* ───────────── musica chiptune (Web Audio) ───────────── */
const PASSO = 60 / 120 / 4;   // sedicesimi a 120 bpm
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
const ACCORDI = { Am: [57, 60, 64], F: [53, 57, 60], C: [52, 55, 60], G: [55, 59, 62], E: [52, 56, 59], Bb: [58, 62, 65] };
const MOTIVO = [0, null, null, 1, 2, null, 1, null, 2, null, 3, null, 2, 1, null, null];
let A = null, uscita = null, bus = null, prossimo = 0, rumore = null;

function sezione(tau) {
  if (tau < 8) return "intro";
  if (tau < 15) return "titolo";
  if (tau < 29) return "ufficio";
  if (tau < 92) return "piena";
  if (tau < 110) return "sicurezza";
  if (tau < 113.5) return "quiete";
  if (tau < 134) return "attacco";
  return "fine";
}
function accordo(sez, battuta) {
  const giro = sez === "sicurezza" ? ["Am", "G", "F", "E"] : sez === "attacco" ? ["Am", "Bb"] : sez === "intro" ? ["Am"] : ["Am", "F", "C", "G"];
  return ACCORDI[giro[battuta % giro.length]];
}
function nota(tipo, f, quando, durata, vol, scivola = null) {
  const o = A.createOscillator(), v = A.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f, quando);
  if (scivola) o.frequency.exponentialRampToValueAtTime(scivola, quando + durata);
  v.gain.setValueAtTime(0, quando); v.gain.linearRampToValueAtTime(vol, quando + .006);
  v.gain.exponentialRampToValueAtTime(.0008, quando + durata);
  o.connect(v); v.connect(bus); o.start(quando); o.stop(quando + durata + .02);
}
function colpo(quando, durata, vol, filtro = 6000) {
  const s = A.createBufferSource(); s.buffer = rumore;
  const f = A.createBiquadFilter(); f.type = "highpass"; f.frequency.value = filtro;
  const v = A.createGain(); v.gain.setValueAtTime(vol, quando); v.gain.exponentialRampToValueAtTime(.0008, quando + durata);
  s.connect(f); f.connect(v); v.connect(bus); s.start(quando); s.stop(quando + durata + .02);
}
function suonaPasso(i, quando) {
  const tau = i * PASSO, sez = sezione(tau);
  if (sez === "quiete") return;
  const s16 = i % 16, battuta = Math.floor(i / 16), acc = accordo(sez, battuta);
  if (sez === "intro" || sez === "fine") {
    if (s16 === 0) acc.forEach((m) => nota("sine", hz(m), quando, 2.2, .05));
    if (i % 2 === 0) nota("triangle", hz(acc[(i / 2) % 3] + 12), quando, .3, .05);
    if (sez === "fine" && tau > 144 && s16 === 0) acc.concat([acc[0] + 14]).forEach((m) => nota("triangle", hz(m + 12), quando, 4, .06));
    return;
  }
  const piena = sez === "piena" || sez === "sicurezza";
  // basso
  if (sez === "attacco") nota("square", hz(acc[0] - 24), quando, .1, .07);
  else if (i % 2 === 0) nota("triangle", hz(acc[0] - 12), quando, .2, .16);
  // arpeggio
  if (sez !== "attacco" || i % 2 === 0) nota(sez === "attacco" ? "sawtooth" : "triangle", hz(acc[s16 % 3] + 12), quando, .12, sez === "attacco" ? .025 : .05);
  // cassa, rullante, charleston
  if (sez !== "ufficio" && i % 8 === 0) nota("sine", 150, quando, .25, .32, 40);
  if (piena && i % 8 === 4) colpo(quando, .12, .12, 2000);
  if (sez !== "titolo" && i % 4 === 2) colpo(quando, .04, .05);
  // melodia
  if (piena) { const k = MOTIVO[s16]; if (k !== null) nota("square", hz([acc[0], acc[1], acc[2], acc[0] + 12][k] + 12), quando, .22, .05); }
  // sirena dell'allarme
  if (sez === "attacco" && tau < 121 && s16 === 0) nota("sawtooth", 600, quando, 1.9, .045, 950);
}
function preparaAudio() {
  if (A) return;
  A = new (window.AudioContext || window.webkitAudioContext)();
  rumore = A.createBuffer(1, A.sampleRate * .5, A.sampleRate);
  const d = rumore.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  uscita = A.createGain(); uscita.gain.value = .55;
  uscita.connect(A.destination);
}
function ripartiMusica(tau) {          // dopo play, pausa o salto: nuovo «bus», le note già programmate tacciono
  if (bus) { bus.gain.cancelScheduledValues(0); bus.gain.setValueAtTime(0, A.currentTime); setTimeout(((b) => () => b.disconnect())(bus), 200); }
  bus = A.createGain(); bus.connect(uscita);
  prossimo = Math.ceil(tau / PASSO);
}
function programma() {
  if (!A || !inCorso) return;
  const tau = adesso();
  while (prossimo * PASSO < tau + .25) {
    const quando = t0 + prossimo * PASSO;
    if (quando >= A.currentTime && prossimo * PASSO < DUR) suonaPasso(prossimo, quando);
    prossimo++;
  }
}

/* ───────────── orologio, comandi e registrazione ───────────── */
let inCorso = false, fermo = 0, t0 = 0, pronto = false, conAudio = true, iniziato = false;
const LOCANDINA = 12.2;   // il fotogramma mostrato prima di premere play: il titolo
const adesso = () => (inCorso ? A.currentTime - t0 : fermo);
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const $ = (id) => document.getElementById(id);

async function play() {
  preparaAudio();
  await A.resume();
  if (fermo >= DUR) fermo = 0;
  t0 = A.currentTime - fermo; inCorso = true; iniziato = true;
  ripartiMusica(fermo);
  $("via").hidden = true; $("play").textContent = "❚❚";
}
function pausa() {
  if (!inCorso) return;
  fermo = adesso(); inCorso = false;
  if (bus) bus.gain.setValueAtTime(0, A.currentTime);
  A.suspend(); $("play").textContent = "▶";
}
function vaiA(s) {
  iniziato = true;
  fermo = clamp(s, 0, DUR);
  if (inCorso) { t0 = A.currentTime - fermo; ripartiMusica(fermo); }
}
function ciclo() {
  let t = adesso();
  if (inCorso && t >= DUR) { pausa(); fermo = DUR; t = DUR; $("via").hidden = false; $("via").firstElementChild.textContent = "↺ Rivedi il trailer"; if (registratore) fermaRegistrazione(); }
  if (pronto) disegna(iniziato ? Math.min(t, DUR - .001) : LOCANDINA);
  programma();
  $("pos").value = t.toFixed(1); $("tempo").textContent = `${mmss(t)} / ${mmss(DUR)}`;
  requestAnimationFrame(ciclo);
}

$("via").addEventListener("click", play);
$("play").addEventListener("click", () => (inCorso ? pausa() : play()));
$("dacapo").addEventListener("click", () => { vaiA(0); if (!inCorso) play(); });
$("pos").addEventListener("input", (e) => vaiA(+e.target.value));
$("audio").addEventListener("click", () => {
  conAudio = !conAudio; $("audio").textContent = conAudio ? "🔊" : "🔇";
  if (uscita) uscita.gain.value = conAudio ? .55 : 0;
});
$("intero").addEventListener("click", () => {
  const el = document.querySelector(".schermo");
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === " ") { e.preventDefault(); inCorso ? pausa() : play(); }
});

/* Registrazione in video (.webm, con la musica): solo nella copia locale, servita dal server del gioco.
 * Dentro l'artifact il browser non permette di scaricare file creati dalla pagina. */
let registratore = null, pezzi = [];
const locale = ["127.0.0.1", "localhost"].includes(location.hostname);
if (locale && window.MediaRecorder && tela.captureStream) {
  $("registra").hidden = false;
  $("nota").innerHTML += " <b>Registra video</b> lo riproduce dall'inizio e alla fine scarica il file: tieni la scheda in primo piano.";
}
async function avviaRegistrazione() {
  preparaAudio(); await A.resume();
  const dest = A.createMediaStreamDestination(); uscita.connect(dest);
  const flusso = new MediaStream([...tela.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const tipo = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find((x) => MediaRecorder.isTypeSupported(x));
  registratore = new MediaRecorder(flusso, { mimeType: tipo, videoBitsPerSecond: 6e6 });
  pezzi = [];
  registratore.ondataavailable = (e) => e.data.size && pezzi.push(e.data);
  registratore.onstop = () => {
    uscita.disconnect(dest);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(pezzi, { type: "video/webm" }));
    a.download = "penguin-inc-trailer.webm"; a.click();
    $("registra").textContent = "⏺ Registra video"; registratore = null;
  };
  vaiA(0); if (inCorso) pausa();
  registratore.start(1000);
  $("registra").textContent = "● Registrazione…";
  await play();
}
function fermaRegistrazione() { if (registratore && registratore.state !== "inactive") registratore.stop(); }
$("registra").addEventListener("click", () => (registratore ? fermaRegistrazione() : avviaRegistrazione()));

/* avvio: prima caratteri e immagini, poi il primo fotogramma */
g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
Promise.all([
  caricaImmagini(),
  document.fonts ? Promise.all([PIX(20), VT(20), PS(20)].map((f) => document.fonts.load(f).catch(() => {}))) : Promise.resolve(),
]).then(() => { pronto = true; });
requestAnimationFrame(ciclo);
</script>
